<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 6- Web Dev Mini-Quest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style2.css">
</head>

<body>

    <div class="card m-5 shadow-sm" style="max-width: 600px; margin: auto !important;">
    <div class="card-body p-4 text-center">
        <span class="badge bg-primary mb-2">Level 6</span>
        <h2 class="fw-bold text-start">Conditionals: Pick the Correct Door</h2>
        <p class="text-muted text-start">Click a door. Only one is correct. Use if/else.</p>
        
        <div class="d-flex justify-content-between gap-2 mb-3">
            <button class="btn btn-success flex-fill door-btn" data-door="1"> Door 1</button>
            <button class="btn btn-warning flex-fill door-btn" data-door="2"> Door 2</button>
            <button class="btn btn-danger flex-fill door-btn" data-door="3"> Door 3</button>
        </div>

        <div id="doorResult" class="bg-light p-4 rounded mb-3 text-muted">
            Choose a door to see the result.
        </div>

        <div class="row g-2">
            <div class="col-6"><a href="lvl5.html" class="btn btn-secondary w-100">← Back</a></div>
            <div class="col-6"><a href="lvl1.html" class="btn btn-dark w-100">↺ Restart (Level 1)</a></div>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="scriptLvl6.js"></script>
</body>

</html>
