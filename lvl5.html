<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 5- Web Dev Mini-Quest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style2.css">

<body>

    <div class="card m-5 shadow-sm" style="max-width: 600px; margin: auto !important;">
    <div class="card-body p-4 text-center">
        <span class="badge bg-primary mb-2">Level 5</span>
        <h2 class="fw-bold text-start">Counter: Coins</h2>
        <p class="text-muted text-start">Use + and - buttons. Coins cannot go below 0.</p>
        
        <div class="d-flex justify-content-between align-items-center bg-light p-4 rounded mb-3">
            <button id="minusBtn" class="btn btn-outline-secondary px-4">-1</button>
            <h3 class="fw-bold m-0">Coins: <span id="coinCount">0</span></h3>
            <button id="plusBtn" class="btn btn-outline-secondary px-4">+1</button>
        </div>

        <div class="row g-2">
            <div class="col-6"><a href="lvl4.html" class="btn btn-secondary w-100">Back</a></div>
            <div class="col-6"><a href="lvl6.html" class="btn btn-dark w-100">Next Level</a></div>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="scriptLvl5.js"></script>
